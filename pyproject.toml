[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skillvoice-studio"
version = "0.2.0"
description = "Local-first narration production pipeline for house voice models."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary - internal house tool" }
authors = [{ name = "SkillVoice Studio" }]
dependencies = [
  "piper-tts==1.6.0",
  "pydantic==2.13.4",
  "rich==15.0.0",
  "typer==0.26.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
]

[project.scripts]
skillvoice = "skillvoice.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["skillvoice"]

[tool.hatch.build.targets.wheel.force-include]
"skillvoice/profiles.json" = "skillvoice/profiles.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=skillvoice --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["skillvoice"]

[tool.coverage.report]
fail_under = 85
show_missing = true
